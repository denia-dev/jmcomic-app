name: Build unsigned IPA

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      admin:
        description: "Admin build (cloud backup enabled)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Admin build flag
        if: ${{ github.event.inputs.admin == 'true' }}
        run: |
          cat > JMReader/AdminFlag.swift <<'EOF'
          import Foundation

          let ADMIN_BUILD = true
          EOF
          cat JMReader/AdminFlag.swift

      - name: Select Xcode 26 (Liquid Glass SDK)
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then echo "Selecting $XC"; sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild -project JMReader.xcodeproj -scheme JMReader \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JMReader-unsigned.ipa Payload
          ls -lh JMReader-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.admin == 'true' && 'JMReader-admin-ipa' || 'JMReader-unsigned-ipa' }}
          path: JMReader-unsigned.ipa
          retention-days: 30
