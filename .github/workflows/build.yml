name: Build unsigned IPA

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (Liquid Glass SDK)
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then echo "Selecting $XC"; sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild -project JMReader.xcodeproj -scheme JMReader \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JMReader-unsigned.ipa Payload
          ls -lh JMReader-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JMReader-unsigned-ipa
          path: JMReader-unsigned.ipa
          retention-days: 30
